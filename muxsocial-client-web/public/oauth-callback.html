<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Authorizing…</title>
	</head>
	<body>
		<p>You can close this window.</p>
		<script>
			// OAuth redirect landing for the popup flow: hand the callback query
			// (?code=…&state=…) back to the app and close.
			//
			// Primary channel is a same-origin BroadcastChannel, because some auth
			// servers (Bluesky) send Cross-Origin-Opener-Policy: same-origin, which
			// severs window.opener — so opener.postMessage would silently drop. The
			// BroadcastChannel is origin-scoped and immune to COOP. opener.postMessage
			// is kept as a fallback for providers that don't sever the opener.
			(() => {
				const message = { type: "muxsocial-oauth-callback", query: window.location.search };
				try {
					const channel = new BroadcastChannel("muxsocial-oauth");
					channel.postMessage(message);
					channel.close();
				} catch {
					// BroadcastChannel unavailable — fall back to the opener below.
				}
				try {
					if (window.opener) {
						window.opener.postMessage(message, window.location.origin);
					}
				} catch {
					// Ignore — the app resolves via the BroadcastChannel instead.
				}
				window.close();
			})();
		</script>
	</body>
</html>
