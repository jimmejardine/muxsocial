[package]
name = "muxsocial-lib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for mux.social: aggregation of Hashiverse, nostr, Mastodon, and Bluesky."

[lints]
workspace = true

[features]
# Exposes the backend-agnostic `config_storage::tests` suite so the wasm client
# crate can run it against its IndexedDB backend.
generic-tests = []

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
http = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

# Source-network protocol libraries. All must build for native AND wasm32, so
# only wasm-clean crates live here (hashiverse-lib, not the native-only
# hashiverse-client-rust). hashiverse-lib's native build needs the local moka
# patch — see the workspace [patch.crates-io].
nostr-sdk = { workspace = true }
atrium-api = { workspace = true }
atrium-xrpc = { workspace = true }
hashiverse-lib = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
gloo-net = { workspace = true }
wasm-bindgen-futures = { workspace = true }
# getrandom js backend so uuid v4 works in the browser.
uuid = { workspace = true, features = ["js"] }
