name: check-translations

# Soft staleness gate for i18n: compares each translated locale against the
# recorded hash of the English source string. Red means a developer should run
# `node muxsocial-client-web/translations/check-translations.mjs` and feed its
# JSON output into a Claude Code session to (re)translate the flagged keys.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "muxsocial-client-web/src/i18n/**"
      - "muxsocial-client-web/public/locales/**"
      - "muxsocial-client-web/translations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Run staleness checker
        run: node muxsocial-client-web/translations/check-translations.mjs
