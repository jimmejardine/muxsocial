name: CI

# Prove the whole app builds end-to-end on every push, and publish to Cloudflare
# Pages on tagged releases. The web client imports the wasm package by relative
# path from muxsocial-rust/muxsocial-client-wasm/pkg (gitignored), so wasm-pack
# must run before the web client will type-check or build.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Manual production deploy on demand (Actions → CI → "Run workflow").
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On a v* tag push, rewrite the workspace Cargo.toml version from the tag
      # BEFORE building, so the wasm bakes in the tagged CARGO_PKG_VERSION (shown
      # in the status bar). No-op on branch/PR builds (stays 0.0.0).
      - uses: ./.github/actions/set-cargo-version-from-tag

      # nostr's secp256k1-sys is C cross-compiled to wasm by cc-rs/clang; the
      # wasm build needs clang/llvm on PATH. (If cc-rs ever fails to auto-pick
      # clang for the wasm32 target, set CC_wasm32_unknown_unknown=clang and
      # AR_wasm32_unknown_unknown=llvm-ar.)
      - name: Install clang/llvm
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          clang --version

      # rust-toolchain.toml in muxsocial-rust pins nightly-2026-05-19; running
      # rustup from that directory honors the override and installs it. Add the
      # wasm target and lint components to that pinned toolchain.
      - name: Set up Rust toolchain
        working-directory: muxsocial-rust
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
          rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: muxsocial-rust

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: muxsocial-client-web/package-lock.json

      # Rewrite the npm package version from the tag early, alongside the Cargo
      # bump (no-op on branch/PR builds). `npm version` updates package.json and
      # package-lock.json together, so they stay in sync for the `npm ci` below.
      # After setup-node so npm is the pinned version and the npm cache key (hashed
      # from the lockfile) is computed before this bump.
      - uses: ./.github/actions/set-npm-version-from-tag

      # All build/test/lint steps live in run_ci_checks.mjs so CI and the local
      # pre-commit run (`node run_ci_checks.mjs`) can't drift. It runs, in order:
      # rust fmt check, clippy (-D warnings), rust tests, wasm-pack build, npm ci,
      # Biome lint, vitest, and the web build (which produces the dist below).
      # clippy/test run against muxsocial-lib on the host: the wasm crate has
      # wasm32-only deps and is exercised via wasm-pack on its real target.
      - name: Run CI checks and build
        run: node run_ci_checks.mjs

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: muxsocial-client-web/dist

  # Publishes the built web client to Cloudflare Pages on v* tags only, after a
  # successful build. Inert until these repo secrets and the Pages project exist:
  #   - CLOUDFLARE_API_TOKEN   (Pages: Edit permission)
  #   - CLOUDFLARE_ACCOUNT_ID
  #   - a Cloudflare Pages project named "muxsocial"
  # Until then, a v* tag fails only this job at the wrangler step, not `build`.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=muxsocial --branch=main
